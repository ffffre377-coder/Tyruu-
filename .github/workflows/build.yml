name: Build Agent Starter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout karo
        uses: actions/checkout@v4

      - name: Zip extract karo
        run: |
          ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Found zip: $ZIPFILE"
          unzip -o "$ZIPFILE" -d extracted
          find extracted -name "gradlew"

      - name: Java setup karo
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK setup karo
        uses: android-actions/setup-android@v3

      - name: Gradlew executable banao
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -maxdepth 3 -name 'gradlew')")
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Debug APK build karo
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -maxdepth 3 -name 'gradlew')")
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: AgentStarter-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
